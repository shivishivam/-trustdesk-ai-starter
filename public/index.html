<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b32"><title>Trust Desk AI</title><style>body{font-family:system-ui;background:#101b32;color:#f7f9ff;margin:0;padding:20px}main{max-width:800px;margin:auto}section{background:#1b2a45;border-radius:16px;padding:18px;margin:16px 0}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border-radius:9px;border:1px solid #64748b}button{background:#48a9ff;color:#07182a;font-weight:700;cursor:pointer}textarea{min-height:100px}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#b9c9df}</style></head><body><main><h1>Trust Desk AI</h1><section><h2>Team attendance &amp; payouts</h2><p>Staff check-in, working hours and payout records.</p><a href="/team" style="color:#8ed4ff;font-size:20px">Open My Team / Team kholein →</a></section><small>Drafts require approval before dispatch. Do not paste secrets into tasks.</small><section><label>Admin token<input id="token" type="password" autocomplete="off" placeholder="Enter admin token"></label><button id="connect">Connect</button><p id="status" role="status">Disconnected</p></section><section><h2>New AI task</h2><select id="agent"><option value="">Connect to load agents</option></select><textarea id="prompt" placeholder="Describe the task"></textarea><button id="run">Generate draft</button></section><section><h2>Tasks</h2><div id="tasks"></div></section></main><script src="/app.js"></script></body></html>
